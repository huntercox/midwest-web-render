services:
    - type: web
      name: mw-docker
      runtime: docker
      repo: https://github.com/huntercox/midwest-web-render
      branch: integrate-midwest-web
      region: ohio
      plan: starter

      dockerfilePath: ./Dockerfile

      # Health check using your existing /debug route
      healthCheckPath: /debug

      envVars:
          # Essential Laravel settings
          - key: APP_KEY
            generateValue: true # Or use your existing key
          - key: APP_ENV
            value: production
          - key: APP_DEBUG
            value: "true" # Set to true initially for debugging, change to false once working
          - key: APP_URL
            sync: false # Set this in Render dashboard to your actual URL

          # Database - connecting to your mw-postgres
          - key: DB_CONNECTION
            value: pgsql
          - key: DATABASE_URL
            fromDatabase:
                name: mw-postgres
                property: connectionString
          - key: DB_HOST
            fromDatabase:
                name: mw-postgres
                property: host
          - key: DB_PORT
            fromDatabase:
                name: mw-postgres
                property: port
          - key: DB_DATABASE
            fromDatabase:
                name: mw-postgres
                property: database
          - key: DB_USERNAME
            fromDatabase:
                name: mw-postgres
                property: user
          - key: DB_PASSWORD
            fromDatabase:
                name: mw-postgres
                property: password

          # Session/Cache - using database driver with PostgreSQL
          - key: SESSION_DRIVER
            value: database
          - key: CACHE_DRIVER
            value: database
          - key: QUEUE_CONNECTION
            value: database

          # CAPTCHA config (from your Contact page)
          - key: HCAPTCHA_SITEKEY
            sync: false # Set in dashboard
          - key: HCAPTCHA_SECRET
            sync: false # Set in dashboard

databases:
    - name: mw-postgres
      # This references your existing PostgreSQL database
