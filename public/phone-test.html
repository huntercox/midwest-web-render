<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Phone Number Formatting Test</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			max-width: 600px;
			margin: 50px auto;
			padding: 20px;
		}

		.test-input {
			width: 100%;
			padding: 10px;
			font-size: 16px;
			border: 2px solid #ddd;
			border-radius: 4px;
			margin: 10px 0;
		}

		.test-result {
			background: #f5f5f5;
			padding: 10px;
			border-radius: 4px;
			margin: 10px 0;
		}
	</style>
</head>

<body>
	<h1>Phone Number Formatting Test</h1>
	<p>Test the phone number formatting by typing in the input below:</p>

	<input type="tel" class="test-input" placeholder="Type a phone number..." id="phoneTest">

	<div class="test-result">
		<strong>Raw Value:</strong> <span id="rawValue">-</span><br>
		<strong>Formatted Value:</strong> <span id="formattedValue">-</span><br>
		<strong>Clean Value:</strong> <span id="cleanValue">-</span><br>
		<strong>Is Valid:</strong> <span id="isValid">-</span>
	</div>

	<script>
		// Simple phone formatting function for testing
		function formatUSPhone(value) {
			if (!value) return ''

			const digits = value.replace(/\D/g, '')
			const limitedDigits = digits.slice(0, 10)

			if (limitedDigits.length === 0) return ''
			if (limitedDigits.length <= 3) return limitedDigits
			if (limitedDigits.length <= 6) {
				return `(${limitedDigits.slice(0, 3)}) ${limitedDigits.slice(3)}`
			}
			return `(${limitedDigits.slice(0, 3)}) ${limitedDigits.slice(3, 6)}-${limitedDigits.slice(6)}`
		}

		function isValidPhone(value) {
			const digits = value.replace(/\D/g, '')
			return digits.length === 10
		}

		const input = document.getElementById('phoneTest')
		const rawSpan = document.getElementById('rawValue')
		const formattedSpan = document.getElementById('formattedValue')
		const cleanSpan = document.getElementById('cleanValue')
		const validSpan = document.getElementById('isValid')

		input.addEventListener('input', function (e) {
			const rawValue = e.target.value
			const formattedValue = formatUSPhone(rawValue)
			const cleanValue = rawValue.replace(/\D/g, '')
			const isValid = isValidPhone(rawValue)

			// Update the input with formatted value
			e.target.value = formattedValue

			// Update display
			rawSpan.textContent = rawValue
			formattedSpan.textContent = formattedValue
			cleanSpan.textContent = cleanValue
			validSpan.textContent = isValid ? 'Yes' : 'No'
			validSpan.style.color = isValid ? 'green' : 'red'
		})

		// Prevent non-numeric input
		input.addEventListener('keydown', function (e) {
			if ([8, 9, 27, 13, 46].indexOf(e.keyCode) !== -1 ||
				(e.keyCode === 65 && e.ctrlKey === true) ||
				(e.keyCode === 67 && e.ctrlKey === true) ||
				(e.keyCode === 86 && e.ctrlKey === true) ||
				(e.keyCode === 88 && e.ctrlKey === true)) {
				return
			}
			if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) {
				e.preventDefault()
			}
		})
	</script>
</body>

</html>
